<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Sentiment Analysis</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Customer Sentiment Analysis</h1>

        <p class="description">
            Analyze customer reviews using Machine Learning.
            Enter a product review below to predict its sentiment.
        </p>

        <textarea
            id="review"
            placeholder="Example: This product is excellent and I love it..."
        ></textarea>

        <div class="buttons">
            <button id="analyzeButton" onclick="analyzeSentiment()">
                Analyze Sentiment
            </button>

            <button id="clearButton" onclick="clearForm()">
                Clear
            </button>
        </div>

        <p id="result" role="status" aria-live="polite"></p>

        <footer>
            E-commerce Customer Sentiment Analysis | Machine Learning Project
        </footer>
    </div>

    <script>
        async function analyzeSentiment() {
            const review = document.getElementById("review").value.trim();
            const result = document.getElementById("result");
            const button = document.getElementById("analyzeButton");

            if (!review) {
                result.textContent = "Please enter a review first.";
                result.className = "error";
                return;
            }

            button.disabled = true;
            result.textContent = "Analyzing your review...";
            result.className = "";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ review: review })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Prediction failed.");
                }

                result.textContent =
                    "Predicted sentiment: " + data.sentiment;

                result.className = data.sentiment.toLowerCase();

            } catch (error) {
                result.textContent = error.message;
                result.className = "error";
            } finally {
                button.disabled = false;
            }
        }

        function clearForm() {
            document.getElementById("review").value = "";

            const result = document.getElementById("result");
            result.textContent = "";
            result.className = "";

            document.getElementById("review").focus();
        }
    </script>
</body>
</html>
